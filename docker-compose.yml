services:
  ttn-db:
    image: postgres:18-alpine
    container_name: ttn-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttn_service
    ports:
      - "5434:5432"
    volumes:
      - ttn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ttn-db-data: